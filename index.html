<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container-login">
        <div class="titulo-login">
            <h1>Login</h1>
            <p>Entre com seu e-mail e senha.</p>
        </div>
        <form class="formLogin">
            <div class="formEmail">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            </div>
            <div class="formSenha">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>
            <div class="campo-botao">
                <button type="submit">Entrar</button>
            </div>
            <p class="link-cadastro">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
    </div>
</body>
<script type="module" src="main.js"></script>
</html>
